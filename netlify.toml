# Netlify Build Configuration
# P&J Capital Portal - Client Portal & Admin Dashboard

[build]
  # 根目錄本身就是靜態站點，無需 build 步驟
  base = "."
  publish = "."
  command = ""  # 無 build 命令（純靜態）

[build.environment]
  # 環境變數（如需要）
  NODE_VERSION = "18"

# 注意：不要為 /portal/* 或 /admin/* 加「導向自己所屬目錄」的 301 規則。
# 例如 from = "/portal/*" → to = "/portal/" 會讓 /portal/ 自己命中自己
# （splat 可比對空字串），與 Netlify 內建的去尾斜線正規化互相拉扯，
# 形成無限轉址迴圈。目錄索引 (portal/index.html) Netlify 本來就會處理，
# 不需要任何額外規則。

# SPA 單頁應用：404 回到首頁（用於前端路由）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTTP 安全標頭
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # 允許自訂域名下的跨域資源
    Access-Control-Allow-Origin = "*"

# 緩存策略
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/portal-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 靜態資源：長期緩存
[[headers]]
  for = "/logo*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# 部署通知
[deploy]
  on_success = "notify"
  on_failure = "notify"
